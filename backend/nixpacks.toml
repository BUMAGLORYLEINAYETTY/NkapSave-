[phases.setup]
# python312: avoids mise attestation errors on Railway
# tesseract: receipt OCR   libheif: HEIC/HEIF photo support
nixPkgs = ["python312", "tesseract", "libheif"]

[phases.install]
cmds = ["pip install -r requirements.txt"]

[start]
cmd = "uvicorn main:app --host 0.0.0.0 --port $PORT"
