<!-- BottomNavBar Suppression Check: Suppressed as per "Linear/Transactional: Login, Sign-up, Onboarding" rule -->
<script>
        // Simple micro-interaction for the PIN inputs
        const inputs = document.querySelectorAll('input[type="password"]');
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && e.target.value.length === 0 && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });

        // Toggle focus state visual
        document.querySelectorAll('.input-focus-ring input').forEach(input => {
            input.addEventListener('focus', () => {
                input.closest('.input-focus-ring').classList.add('ring-2', 'ring-primary/20', 'border-primary');
            });
            input.addEventListener('blur', () => {
                input.closest('.input-focus-ring').classList.remove('ring-2', 'ring-primary/20', 'border-primary');
            });
        });
    </script>
