<body class="flex items-center justify-center min-h-screen p-margin-mobile">
<!-- Background Decoration -->
<div class="fixed inset-0 -z-10 overflow-hidden">
<div class="absolute -top-24 -left-24 w-96 h-96 bg-primary-container opacity-10 rounded-full blur-3xl"></div>
<div class="absolute -bottom-24 -right-24 w-96 h-96 bg-tertiary-container opacity-10 rounded-full blur-3xl"></div>
</div>
<!-- Main Login Canvas -->
<main class="w-full max-w-[440px] flex flex-col gap-xl">
<!-- Header / Brand Anchor -->
<header class="flex flex-col items-center gap-sm">
<div class="w-16 h-16 bg-primary rounded-xl flex items-center justify-center shadow-lg shadow-primary/20 mb-xs">
<span class="material-symbols-outlined text-white text-[32px]" style="font-variation-settings: 'FILL' 1;">shield_person</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface tracking-tight">NkapSave</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Secure access to your savings</p>
</header>
<!-- Form Card -->
<div class="bg-surface-container-lowest rounded-xl shadow-[0_4px_12px_rgba(0,0,0,0.04)] p-lg border border-outline-variant/30">
<form class="flex flex-col gap-lg" onsubmit="return false;">
<!-- Phone Number Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-lg text-label-lg text-on-surface-variant ml-xs">Phone Number</label>
<div class="relative flex items-center">
<div class="absolute left-md flex items-center gap-xs pr-sm border-r border-outline-variant">
<span class="text-on-surface font-label-lg text-label-lg">+237</span>
</div>
<input class="w-full h-14 pl-[72px] pr-md bg-surface border-outline-variant rounded-xl font-body-lg text-body-lg focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all placeholder:text-outline" placeholder="6XX XXX XXX" type="tel"/>
</div>
</div>
<!-- 4-Digit PIN -->
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center px-xs">
<label class="font-label-lg text-label-lg text-on-surface-variant">Enter PIN</label>
<a class="font-label-sm text-label-sm text-primary hover:underline" href="#">Forgot PIN?</a>
</div>
<div class="flex justify-between gap-sm">
<input autocomplete="off" class="pin-input w-full h-14 text-center bg-surface border-outline-variant rounded-xl text-headline-md font-headline-md focus:ring-0 transition-all" maxlength="1" type="password"/>
<input autocomplete="off" class="pin-input w-full h-14 text-center bg-surface border-outline-variant rounded-xl text-headline-md font-headline-md focus:ring-0 transition-all" maxlength="1" type="password"/>
<input autocomplete="off" class="pin-input w-full h-14 text-center bg-surface border-outline-variant rounded-xl text-headline-md font-headline-md focus:ring-0 transition-all" maxlength="1" type="password"/>
<input autocomplete="off" class="pin-input w-full h-14 text-center bg-surface border-outline-variant rounded-xl text-headline-md font-headline-md focus:ring-0 transition-all" maxlength="1" type="password"/>
</div>
</div>
<!-- Login Actions -->
<div class="flex flex-col gap-md pt-xs">
<button class="w-full h-14 bg-primary text-on-primary font-label-lg text-label-lg rounded-xl shadow-md active:scale-95 transition-transform duration-100 flex items-center justify-center gap-sm" type="submit">
                        Log In
                    </button>
<div class="flex items-center gap-md py-sm">
<div class="h-[1px] flex-1 bg-outline-variant/30"></div>
<span class="font-label-sm text-label-sm text-outline">OR</span>
<div class="h-[1px] flex-1 bg-outline-variant/30"></div>
</div>
<button class="w-full h-14 bg-surface border border-primary text-primary font-label-lg text-label-lg rounded-xl flex items-center justify-center gap-sm active:bg-surface-container-low transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="fingerprint">fingerprint</span>
                        Biometric Login
                    </button>
</div>
</form>
</div>
<!-- Footer / Redirect -->
<footer class="flex justify-center items-center py-md">
<p class="font-body-md text-body-md text-on-surface-variant">
                Don't have an account? 
                <a class="text-primary font-label-lg text-label-lg hover:underline ml-xs" href="#">Sign up</a>
</p>
</footer>
</main>
<!-- Trust Indicators (Subtle) -->
<div class="fixed bottom-margin-mobile left-0 right-0 flex justify-center opacity-40 pointer-events-none">
<div class="flex items-center gap-xs">
<span class="material-symbols-outlined text-[14px]">lock</span>
<span class="font-label-sm text-label-sm uppercase tracking-widest">End-to-End Encrypted</span>
</div>
</div>
<script>
        // Automatic Focus Shift for PIN inputs
        const pinInputs = document.querySelectorAll('.pin-input');
        pinInputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && index < pinInputs.length - 1) {
                    pinInputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && e.target.value.length === 0 && index > 0) {
                    pinInputs[index - 1].focus();
                }
            });
        });

        // Micro-interaction for the Biometric Button
        const bioBtn = document.querySelector('button[type="button"]');
        bioBtn.addEventListener('click', () => {
            bioBtn.classList.add('scale-95');
            setTimeout(() => bioBtn.classList.remove('scale-95'), 100);
            console.log('Requesting local_auth biometric prompt...');
        });
    </script>
