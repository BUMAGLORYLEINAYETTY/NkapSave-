<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>

                        "surface-container-lowest": "#ffffff",

                        "on-error": "#ffffff",

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Hanken Grotesk', sans-serif;
            background-color: #f8f9fa;
        }
        .pin-input:focus {
            outline: none;
            border-color: #00450d;
            background-color: #ffffff;
            box-shadow: 0 0 0 1px #00450d;
        }
        input:focus {
            outline: none;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-margin bg-surface">
<!-- Main Login Canvas -->
<main class="w-full max-w-[400px] flex flex-col gap-lg items-center">
<!-- Header / Brand -->
<header class="flex flex-col items-center gap-base text-center">
<div class="w-16 h-16 bg-primary-container rounded-xl flex items-center justify-center shadow-sm mb-base">
<span class="material-symbols-outlined text-on-primary text-[32px]" style="font-variation-settings: 'FILL' 1;">shield_person</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface">NkapSave</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Secure access to your savings</p>
</header>
<!-- Form Card -->
<div class="w-full bg-surface-container-lowest rounded-xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] p-lg border border-outline-variant/40">
<form class="flex flex-col gap-md" onsubmit="return false;">
<!-- Phone Number Input -->
<div class="flex flex-col gap-base">
<label class="font-label-lg text-label-lg text-on-surface-variant ml-xs">Phone Number</label>
<div class="relative flex items-center group">
<div class="absolute left-md flex items-center gap-xs pr-sm border-r border-outline-variant transition-colors group-focus-within:border-primary">
<span class="text-on-surface font-label-lg text-label-lg">+237</span>
</div>
<input class="w-full h-14 pl-[76px] pr-md bg-surface-container-lowest border border-outline-variant rounded-lg font-body-lg text-body-lg focus:border-primary transition-all placeholder:text-outline/60" placeholder="6XX XXX XXX" type="tel"/>
</div>
</div>
<!-- 4-Digit PIN -->
<div class="flex flex-col gap-base">
<div class="flex justify-between items-center px-xs">
<label class="font-label-lg text-label-lg text-on-surface-variant">Enter PIN</label>
<a class="font-label-md text-label-md text-primary hover:underline" href="#">Forgot PIN?</a>
</div>
<div class="grid grid-cols-4 gap-gutter">
<input autocomplete="off" class="pin-input w-full h-14 text-center bg-surface-container-low border border-outline-variant rounded-lg text-headline-md font-headline-md transition-all" maxlength="1" type="password"/>
<input autocomplete="off" class="pin-input w-full h-14 text-center bg-surface-container-low border border-outline-variant rounded-lg text-headline-md font-headline-md transition-all" maxlength="1" type="password"/>
<input autocomplete="off" class="pin-input w-full h-14 text-center bg-surface-container-low border border-outline-variant rounded-lg text-headline-md font-headline-md transition-all" maxlength="1" type="password"/>
<input autocomplete="off" class="pin-input w-full h-14 text-center bg-surface-container-low border border-outline-variant rounded-lg text-headline-md font-headline-md transition-all" maxlength="1" type="password"/>
</div>
</div>
<!-- Login Actions -->
<div class="flex flex-col gap-sm pt-sm">
<button class="w-full h-14 bg-primary text-on-primary font-label-lg text-label-lg rounded-lg shadow-sm active:scale-[0.98] transition-all duration-100 flex items-center justify-center gap-sm" type="submit">
                        Log In
                    </button>
<div class="flex items-center gap-md py-base">
<div class="h-[1px] flex-1 bg-outline-variant/50"></div>
<span class="font-label-md text-label-md text-outline uppercase tracking-widest">or</span>
<div class="h-[1px] flex-1 bg-outline-variant/50"></div>
</div>
<button class="w-full h-14 bg-surface-container-lowest border border-outline-variant text-on-surface-variant font-label-lg text-label-lg rounded-lg flex items-center justify-center gap-sm active:bg-surface-container-low transition-colors group" type="button">
<span class="material-symbols-outlined text-[20px] text-primary group-hover:scale-110 transition-transform" data-icon="fingerprint">fingerprint</span>
                        Biometric Login
                    </button>
</div>
</form>
</div>
<!-- Footer / Redirect -->
<footer class="flex flex-col items-center gap-lg">
<p class="font-body-md text-body-md text-on-surface-variant">
                Don't have an account? 
                <a class="text-primary font-label-lg text-label-lg hover:underline ml-xs" href="#">Sign up</a>
</p>
<!-- Trust Indicator -->
<div class="flex items-center gap-xs opacity-40">
<span class="material-symbols-outlined text-[14px]">lock</span>
<span class="font-label-md text-[11px] uppercase tracking-[0.2em] font-bold">End-to-End Encrypted</span>
</div>
</footer>
</main>
<script>
        // Automatic Focus Shift for PIN inputs
        const pinInputs = document.querySelectorAll('.pin-input');
        pinInputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && index < pinInputs.length - 1) {
                    pinInputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && e.target.value.length === 0 && index > 0) {
                    pinInputs[index - 1].focus();
                }
            });
        });

        // Micro-interaction for the Biometric Button
        const bioBtn = document.querySelector('button[type="button"]');
        bioBtn.addEventListener('click', () => {
            console.log('Requesting biometric authentication...');
        });
    </script>
</body></html>
