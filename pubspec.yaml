name: nkapsave
description: Intelligent financial management for Cameroon
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Navigation
  go_router: ^12.1.3

  # State Management
  flutter_riverpod: ^2.4.10
  riverpod_annotation: ^2.3.4

  # Networking
  dio: ^5.4.3
  web_socket_channel: ^2.4.0

  # Local Storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3
  hive_flutter: ^1.1.0

  # UI & Charts
  fl_chart: ^0.66.2
  percent_indicator: ^4.2.3
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  lottie: ^2.7.0

  # Forms & Validation
  flutter_form_builder: ^9.2.1
  form_builder_validators: ^9.1.0

  # Utils
  intl: ^0.18.1
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  uuid: ^4.3.3
  timeago: ^3.6.1
  url_launcher: ^6.2.5
  image_picker: ^1.0.7
  speech_to_text: ^6.6.0
  share_plus: ^7.2.2
  path_provider: ^2.1.3
  qr_flutter: ^4.1.0
  permission_handler: ^11.1.0
  local_auth: ^2.1.8
  flutter_local_notifications: ^16.3.3
  connectivity_plus: ^5.0.2
  package_info_plus: ^4.2.0

  # Google Fonts
  google_fonts: ^5.1.0

  # Push notifications (FCM)
  firebase_core: ^2.24.0
  firebase_messaging: ^14.7.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  freezed: ^2.4.7
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.11
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/fonts/